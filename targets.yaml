# Maps each variant being compared to the actual function to test.
# Point this at ANY Python function that takes a question string and
# returns an answer — it doesn't need to be an agent, doesn't need
# tools, and doesn't need to match any particular return shape.
#
# Supported return shapes from your function:
#   - A plain string (just the answer text) — simplest case, e.g. a
#     summarizer or classifier with no tool use.
#   - A dict with an "answer" key, and optionally "tools_used",
#     "tool_outputs", "error", "error_type", "retries_needed" —
#     anything not present is filled in with sensible defaults
#     (empty list / None). error_type is a short label for why it
#     failed, e.g. "loop_limit", "rate_limit", "timeout", "auth", "crash".
#
# To test something other than the built-in support-bot agents,
# change module/function below to point at your own code.

strong:
  module: test_agent
  function: run_agent

weak:
  module: agent_v2_weak
  function: run_agent

# Built from experiment settings (experiments/*.yaml), run via
# run_experiment.py. accepts_settings: true means the harness calls
# function(question, settings=<the experiment's settings>); without it,
# function(question) exactly as for strong/weak. Plug in your own system
# the same way: its function receives the settings dict and decides what
# the keys mean (chunk_size, top_k, prompt, ...). run_suite.py and
# pipeline.py ignore this entry.
configurable:
  module: agent_configurable
  function: run_agent
  accepts_settings: true
  # one line about what this system is for; used by the scope prompt addon
  # and the adversarial scenario templates
  description: "customer support for an online store: order status, refunds, shipping, returns and payment methods"
  # optional: a function returning this target's tools, for fuzz_tools.py.
  # Only list tools that are safe to call with junk input (no real writes/emails).
  tools: agent_configurable:build_tools
  # tools that don't fetch information, so context_relevance ignores their output
  non_retrieval_tools: [escalate_to_human]
  # Per-target keys (all optional; see target_config.py). Defaults = the old behaviour:
  #   judges: [...]        which judges apply (others N/A, not in final_score); default all
  #   pass_threshold: 7    final_score >= this is a pass
  #   scenarios: scenarios its main scenario folder

# Example of plugging in a system that is NOT the support bot: a plain function,
# no tools, no settings. Nothing in the framework was changed for it.
summarizer:
  module: examples.summarizer.summarizer
  function: summarize
  description: "summarises a short news article in at most two sentences"
  judge_set: generic_v1                                  # domain-neutral judge wording
  judges: [correctness_gt, completeness, groundedness]   # no tools: tool judges are N/A
  pass_threshold: 7
  scenarios: examples/summarizer/scenarios
