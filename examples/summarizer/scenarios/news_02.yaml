question: "Summarise: Researchers at Lakeside University have found that a common garden plant can absorb heavy metals from soil. The team tested the plant in three polluted sites over two years. They say it could offer a cheap way to clean contaminated land."
expected_answer: "Lakeside University researchers found a garden plant that absorbs heavy metals from soil, tested at three polluted sites over two years. Must not invent the plant's name or results not in the article."
