<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060913; --panel: #0e1424; --panel-2: #131a2d; --border: #202a44; --border-hi: #33436b;
    --text: #e8edf7; --text-dim: #7c88a8; --text-faint: #4a5474; --accent: #5b8dff; --accent-soft: #26386b;
    --fail: #ec6f63; --pass: #5fc99a; --warn: #e8b85a;
    --font-display: 'Space Grotesk', sans-serif; --font-body: 'Inter', -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
  main { max-width: 1100px; margin: 0 auto; padding: 28px 28px 60px; display: grid; gap: 22px; }
  .hero h1 { font-family: var(--font-display); font-size: 28px; margin: 0 0 8px; letter-spacing: -0.01em; }
  .hero p { margin: 0; color: var(--text-dim); font-size: 15px; max-width: 760px; }
  .hero p strong { color: var(--text); font-weight: 600; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; overflow-x: auto; }
  .panel h2 { font-family: var(--font-display); font-size: 16px; margin: 0 0 4px; }
  .panel .lead { color: var(--text-dim); font-size: 13px; margin: 0 0 12px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--text-dim); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  td.num { font-family: var(--font-mono); text-align: right; white-space: nowrap; }
  .mono { font-family: var(--font-mono); font-size: 12px; }
  .dim { color: var(--text-dim); } .faint { color: var(--text-faint); }
  .q { color: var(--text-dim); font-size: 12px; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .s-pass { background: rgba(95,201,154,.18); color: var(--pass); }
  .s-fail { background: rgba(236,111,99,.18); color: var(--fail); }
  .s-planned, .s-missing { background: var(--panel-2); color: var(--text-dim); }
  .v-DECLINED { background: rgba(236,111,99,.18); color: var(--fail); }
  .v-IMPROVED { background: rgba(95,201,154,.18); color: var(--pass); }
  .v-IMPROVED-WITH-REGRESSIONS, .v-NOT-ENOUGH-DATA { background: rgba(232,184,90,.18); color: var(--warn); }
  .v-NO-REAL-DIFFERENCE { background: var(--panel-2); color: var(--text); }
  .findings { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .finding { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
  .finding h3 { font-family: var(--font-display); font-size: 14px; margin: 0 0 6px; }
  .finding p { margin: 0; color: var(--text-dim); font-size: 13px; }
  .md { line-height: 1.6; font-size: 14px; }
  .md h1 { font-family: var(--font-display); font-size: 24px; margin: 0 0 12px; }
  .md h2 { font-family: var(--font-display); font-size: 18px; margin: 28px 0 10px; padding-top: 14px; border-top: 1px solid var(--border); }
  .md h3 { font-family: var(--font-display); font-size: 15px; margin: 20px 0 8px; }
  .md code { font-family: var(--font-mono); font-size: 12px; background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }
  .md pre { background: var(--panel-2); padding: 12px; border-radius: 8px; overflow-x: auto; }
  .md pre code { background: none; padding: 0; }
  .md table { margin: 10px 0 16px; font-size: 13px; display: block; overflow-x: auto; }
  .md th { text-transform: none; letter-spacing: 0; }
  .md strong { color: var(--text); }
  .md li { margin: 3px 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-family: var(--font-mono); font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border-hi); color: var(--text); }
  .chip.na { color: var(--text-faint); border-style: dashed; text-decoration: line-through; }
  .crumb { color: var(--text-dim); font-size: 13px; }
  @media (max-width: 640px) { main { padding: 20px 16px 48px; } .hero h1 { font-size: 22px; } }
</style>
