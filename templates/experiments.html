<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Experiments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060913;
    --panel: #0e1424;
    --panel-2: #131a2d;
    --border: #202a44;
    --border-hi: #33436b;
    --text: #e8edf7;
    --text-dim: #7c88a8;
    --text-faint: #4a5474;
    --accent: #5b8dff;
    --accent-soft: #26386b;
    --fail: #ec6f63;
    --pass: #5fc99a;
    --warn: #e8b85a;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 14px; }
  header { display: flex; align-items: baseline; gap: 16px; padding: 20px 28px; border-bottom: 1px solid var(--border); }
  header h1 { font-family: var(--font-display); font-size: 20px; margin: 0; }
  header a { color: var(--text-dim); text-decoration: none; font-size: 13px; }
  header a:hover { color: var(--accent); }
  header .sub { color: var(--text-dim); font-size: 13px; margin-left: auto; }
  main { padding: 20px 28px 60px; display: grid; gap: 20px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; overflow-x: auto; }
  .panel h2 { font-family: var(--font-display); font-size: 15px; margin: 0 0 12px; color: var(--text); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--text-dim); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  td.num { font-family: var(--font-mono); text-align: right; white-space: nowrap; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: var(--panel-2); }
  tr.selected td { background: var(--accent-soft); }
  .mono { font-family: var(--font-mono); font-size: 12px; }
  .dim { color: var(--text-dim); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .v-DECLINED { background: rgba(236,111,99,.18); color: var(--fail); }
  .v-IMPROVED { background: rgba(95,201,154,.18); color: var(--pass); }
  .v-IMPROVED-WITH-REGRESSIONS, .v-NOT-ENOUGH-DATA { background: rgba(232,184,90,.18); color: var(--warn); }
  .v-NO-REAL-DIFFERENCE, .v-none { background: var(--panel-2); color: var(--text-dim); }
  .star { color: var(--warn); }
  .up { color: var(--pass); } .down { color: var(--fail); } .same { color: var(--text-faint); }
  svg text { fill: var(--text-dim); font-family: var(--font-mono); font-size: 11px; }
  svg .axis { stroke: var(--border-hi); }
  svg circle { cursor: pointer; stroke: var(--bg); stroke-width: 2; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
  .kv div { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px dashed var(--border); }
  .cause { margin: 0 0 12px; padding: 10px 12px; background: var(--panel-2); border-radius: 8px; }
  .cause b { font-family: var(--font-display); }
  .empty { color: var(--text-dim); padding: 8px 0; }
</style>
</head>
<body>
<header>
  <h1>Experiments</h1>
  <a href="/">&larr; Investigator</a>
  <span class="sub" id="subtitle">reading runs/ and baselines/ from disk</span>
</header>
<main>
  <section class="panel">
    <h2>Runs</h2>
    <table>
      <thead><tr><th>run</th><th>date</th><th>what changed</th><th>pass rate</th><th>mean score</th>
        <th>tokens</th><th>cost</th><th>verdict</th></tr></thead>
      <tbody id="runs"><tr><td colspan="8" class="empty">Loading...</td></tr></tbody>
    </table>
  </section>

  <section class="panel">
    <h2>Quality vs cost <span class="dim" id="scatter-note"></span></h2>
    <div id="scatter"></div>
  </section>

  <section class="panel" id="detail-panel" hidden>
    <h2 id="detail-title"></h2>
    <div id="detail"></div>
  </section>
</main>

<script>
let RUNS = [];

function esc(value) {
  // Everything shown comes from files on disk: insert it as text, never as HTML.
  const div = document.createElement('div');
  div.textContent = value === null || value === undefined ? '' : String(value);
  return div.innerHTML;
}
const num = (x, d = 2) => (x === null || x === undefined) ? '-' : Number(x).toFixed(d);
const pct = x => (x === null || x === undefined) ? '-' : `${Math.round(x * 100)}%`;
const tokens = x => (x === null || x === undefined) ? '-' : Number(x).toLocaleString();
const money = x => (x === null || x === undefined) ? '-' : `$${Number(x).toFixed(4)}`;
const verdictClass = v => 'v-' + (v ? v.replace(/ /g, '-') : 'none');
const COLORS = { 'DECLINED': '#ec6f63', 'IMPROVED': '#5fc99a', 'IMPROVED WITH REGRESSIONS': '#e8b85a',
                 'NOT ENOUGH DATA': '#e8b85a', 'NO REAL DIFFERENCE': '#7c88a8' };

function formatDate(ts) {
  if (!ts || ts.length < 15) return esc(ts);
  return esc(`${ts.slice(0, 4)}-${ts.slice(4, 6)}-${ts.slice(6, 8)} ${ts.slice(9, 11)}:${ts.slice(11, 13)}`);
}

function renderRuns() {
  const body = document.getElementById('runs');
  if (!RUNS.length) {
    body.innerHTML = '<tr><td colspan="8" class="empty">No runs yet: python experiment_pipeline.py experiments/baseline.yaml</td></tr>';
    return;
  }
  body.innerHTML = RUNS.map(r => `
    <tr class="clickable" data-run="${esc(r.run_id)}">
      <td>${r.is_baseline ? '<span class="star" title="current baseline">&#9733;</span> ' : ''}<b>${esc(r.experiment)}</b>
        <div class="mono dim">${esc(r.run_id)}</div></td>
      <td class="mono">${formatDate(r.timestamp)}</td>
      <td class="mono">${esc(r.what_changed)}</td>
      <td class="num">${r.judged ? pct(r.pass_rate) : '<span class="dim">not judged</span>'}</td>
      <td class="num">${num(r.mean_final_score)}</td>
      <td class="num">${tokens(r.total_tokens)}</td>
      <td class="num">${money(r.estimated_cost_usd)}</td>
      <td><span class="badge ${verdictClass(r.verdict)}">${esc(r.verdict || 'not compared')}</span></td>
    </tr>`).join('');
  body.querySelectorAll('tr.clickable').forEach(tr => tr.addEventListener('click', () => openRun(tr.dataset.run)));
}

function renderScatter() {
  const judged = RUNS.filter(r => r.mean_final_score !== null && r.mean_final_score !== undefined);
  const useCost = judged.length > 0 && judged.every(r => r.estimated_cost_usd !== null && r.estimated_cost_usd !== undefined);
  const xKey = useCost ? 'estimated_cost_usd' : 'total_tokens';
  const pts = judged.filter(r => r[xKey] !== null && r[xKey] !== undefined);
  document.getElementById('scatter-note').textContent =
    `(${pts.length} judged run${pts.length === 1 ? '' : 's'}; x = ${useCost ? 'estimated cost' : 'total tokens, since not every run has a cost'})`;
  const box = document.getElementById('scatter');
  if (!pts.length) { box.innerHTML = '<div class="empty">No judged runs with token usage yet.</div>'; return; }

  const W = 760, H = 300, m = { l: 56, r: 20, t: 14, b: 40 };
  const xs = pts.map(r => r[xKey]), ys = pts.map(r => r.mean_final_score);
  let x0 = Math.min(...xs), x1 = Math.max(...xs);
  if (x0 === x1) { x0 = x0 * 0.9; x1 = x1 * 1.1 || 1; }
  const y0 = Math.max(0, Math.floor(Math.min(...ys)) - 1), y1 = Math.min(10, Math.ceil(Math.max(...ys)) + 1);
  const sx = v => m.l + (v - x0) / (x1 - x0) * (W - m.l - m.r);
  const sy = v => H - m.b - (v - y0) / ((y1 - y0) || 1) * (H - m.t - m.b);
  const fmtX = v => useCost ? `$${v.toFixed(4)}` : Math.round(v).toLocaleString();
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="quality versus cost">`;
  svg += `<line class="axis" x1="${m.l}" y1="${H - m.b}" x2="${W - m.r}" y2="${H - m.b}"/>`;
  svg += `<line class="axis" x1="${m.l}" y1="${m.t}" x2="${m.l}" y2="${H - m.b}"/>`;
  for (let i = 0; i <= 4; i++) {
    const xv = x0 + (x1 - x0) * i / 4, yv = y0 + (y1 - y0) * i / 4;
    svg += `<text x="${sx(xv)}" y="${H - m.b + 16}" text-anchor="middle">${esc(fmtX(xv))}</text>`;
    svg += `<text x="${m.l - 8}" y="${sy(yv) + 4}" text-anchor="end">${yv.toFixed(1)}</text>`;
  }
  svg += `<text x="${(W + m.l) / 2}" y="${H - 6}" text-anchor="middle">${useCost ? 'estimated cost (USD)' : 'total tokens'}</text>`;
  svg += `<text x="14" y="${(H - m.b) / 2}" transform="rotate(-90 14 ${(H - m.b) / 2})" text-anchor="middle">mean final_score</text>`;
  pts.forEach(r => {
    svg += `<circle cx="${sx(r[xKey])}" cy="${sy(r.mean_final_score)}" r="${r.is_baseline ? 8 : 6}"
              fill="${COLORS[r.verdict] || '#5b8dff'}" data-run="${esc(r.run_id)}">
              <title>${esc(r.experiment)} (${esc(r.run_id)})&#10;score ${num(r.mean_final_score)}, ${esc(fmtX(r[xKey]))}&#10;${esc(r.verdict || 'not compared')}</title>
            </circle>`;
  });
  box.innerHTML = svg + '</svg>';
  box.querySelectorAll('circle').forEach(c => c.addEventListener('click', () => openRun(c.dataset.run)));
}

async function openRun(runId) {
  document.querySelectorAll('tr.clickable').forEach(tr => tr.classList.toggle('selected', tr.dataset.run === runId));
  const res = await fetch(`/api/experiments/runs/${encodeURIComponent(runId)}`);
  const panel = document.getElementById('detail-panel');
  panel.hidden = false;
  if (!res.ok) { document.getElementById('detail').innerHTML = '<div class="empty">Run not found.</div>'; return; }
  const d = await res.json();
  document.getElementById('detail-title').innerHTML =
    `${esc(d.experiment)} <span class="mono dim">${esc(d.run_id)}</span> <span class="badge ${verdictClass(d.verdict)}">${esc(d.verdict || 'not compared')}</span>`;

  const judges = Object.entries(d.per_judge_mean || {}).map(([k, v]) => `<div><span>${esc(k)}</span><span class="mono">${num(v, 1)}</span></div>`).join('');
  const errors = Object.entries(d.errors_by_type || {}).map(([k, v]) => `${esc(k)} ${esc(v)}`).join(', ') || 'none';
  let html = `<div class="grid2">
    <div class="kv"><div><span>what changed</span><span class="mono">${esc(d.what_changed)}</span></div>
      <div><span>pass rate</span><span class="mono">${pct(d.pass_rate)}</span></div>
      <div><span>mean final_score</span><span class="mono">${num(d.mean_final_score)}</span></div>
      <div><span>judge set</span><span class="mono">${esc(d.judge_set || '-')}</span></div>
      <div><span>tokens / cost</span><span class="mono">${tokens(d.total_tokens)} / ${money(d.estimated_cost_usd)}</span></div>
      <div><span>agent errors</span><span class="mono">${errors}</span></div></div>
    <div class="kv">${judges || '<div class="empty">not judged</div>'}
      ${d.tool_match_mean !== null && d.tool_match_mean !== undefined ? `<div><span>tool_match (code check)</span><span class="mono">${num(d.tool_match_mean, 1)}</span></div>` : ''}</div>
  </div>`;

  const c = d.comparison;
  if (!c) {
    html += '<p class="empty">Not compared with a baseline yet (python compare.py runs/' + esc(d.run_id) + ').</p>';
  } else {
    const sym = { up: '&#9650;', down: '&#9660;', same: '&#9552;' };
    const rows = [...c.rows].sort((a, b) => a.delta - b.delta).map(r => `
      <tr><td class="${r.direction}">${sym[r.direction]}</td><td class="mono">${esc(r.scenario_id)}</td>
        <td class="num">${num(r.baseline_score, 1)}</td><td class="num">${num(r.run_score, 1)}</td>
        <td class="num">${(r.delta >= 0 ? '+' : '') + num(r.delta, 1)}</td><td class="num">${num(r.band, 1)}</td>
        <td>${esc(r.flip || '')}</td><td class="mono">${esc([...(r.judges_moved || []), ...(r.notes || [])].join(', '))}</td></tr>`).join('');
    html += `<h2 style="margin-top:18px">vs baseline <span class="mono dim">${esc(c.baseline_experiment)}</span></h2>
      <p class="dim">${esc(c.counts.up)} up, ${esc(c.counts.down)} down, ${esc(c.counts.same)} same of ${esc(c.pairs)} paired &middot;
        McNemar p=${num(c.mcnemar.p, 4)} &middot; Wilcoxon p=${num(c.wilcoxon.p, 4)} &middot; ${esc(c.verdict_reason)}</p>
      <p class="mono dim">${esc(c.noise_bands)}</p>
      <table><thead><tr><th></th><th>scenario</th><th>base</th><th>run</th><th>delta</th><th>band</th><th>pass/fail</th><th>judges moved</th></tr></thead>
      <tbody>${rows}</tbody></table>`;
  }
  if ((d.diagnosis || []).length) {
    html += '<h2 style="margin-top:18px">Diagnosis</h2>' + d.diagnosis.map(x => `
      <div class="cause"><b>${esc(x.scenario_id)}: ${esc(x.cause)}</b>
        <div class="dim">${esc(x.evidence)}</div><div>next: ${esc(x.suggestion)}</div></div>`).join('');
  }
  const ft = Object.entries(d.fine_tune_candidates || {});
  if (ft.length) {
    html += '<h2 style="margin-top:18px">Fine-tuning candidates</h2>' + ft.map(([sid, runs]) =>
      `<div class="cause"><b>${esc(sid)}</b>: failed under ${esc(new Set(runs.map(r => r.prompt)).size)} prompts
        <div class="mono dim">${runs.map(r => esc(r.run_dir)).join('<br>')}</div></div>`).join('');
  }
  document.getElementById('detail').innerHTML = html;
  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function load() {
  try {
    RUNS = await (await fetch('/api/experiments/runs')).json();
    document.getElementById('subtitle').textContent = `${RUNS.length} run${RUNS.length === 1 ? '' : 's'} in runs/`;
  } catch (e) {
    document.getElementById('runs').innerHTML = '<tr><td colspan="8" class="empty">Could not reach /api/experiments/runs: is app.py running?</td></tr>';
    return;
  }
  renderRuns();
  renderScatter();
}
load();
</script>
</body>
</html>
