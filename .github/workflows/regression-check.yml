name: Agent Reliability Check

on:
  # Only run when something that can change results changed (not docs).
  push:
    branches: [master]
    paths:
      - "**.py"
      - "scenarios/**"
      - "targets.yaml"
      - "prompts/**"
      - "requirements.txt"
      - ".github/workflows/regression-check.yml"
  pull_request:
    paths:
      - "**.py"
      - "scenarios/**"
      - "targets.yaml"
      - "prompts/**"
      - "requirements.txt"
      - ".github/workflows/regression-check.yml"
  # Manual "Run workflow" button on the Actions tab.
  workflow_dispatch:
  # Nightly 03:00 UTC: catches drift with no code change (e.g. the model
  # behind the same name being updated). Runs on the default branch only.
  schedule:
    - cron: "0 3 * * *"

jobs:
  regression-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Seed database
        run: python store.py

      - name: Run reliability pipeline
        run: python pipeline.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}